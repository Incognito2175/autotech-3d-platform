# Pipeline 2: CI/CD para AutoTech 3D Platform (Backend Flask + Frontend React)
#
# Ejecuta:
#   1. Backend Unit Tests (SQLite en memoria)
#   2. Backend Integration Tests (MySQL temporal)
#   3. Frontend Build (React + Vite + Three.js)
#   4. Deploy a EC2 (si hay secrets configurados)

name: 02 - CI/CD Deploy EC2

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  APP_DIR: /opt/flaskapp

jobs:
  unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Ejecutar pruebas unitarias
        env:
          FLASK_ENV: testing
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: test
        run: pytest tests/unit --cov=app --cov-report=xml --junitxml=unit-results.xml

      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            backend/unit-results.xml
            backend/coverage.xml

  integration-tests:
    name: Backend Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      FLASK_ENV: development
      DATABASE_URL: mysql+pymysql://app:app@127.0.0.1:3306/app_test
      SECRET_KEY: test
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Ejecutar pruebas de integración
        run: pytest tests/integration --junitxml=integration-results.xml

      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/integration-results.xml

  frontend-build:
    name: Frontend Build (React + Three.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias y compilar
        run: |
          npm install
          npm run build

  deploy:
    name: Deploy
    needs: [integration-tests, frontend-build]
    if: github.event_name != 'pull_request' && vars.ENABLE_EC2_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar carpeta de releases
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR
          script: |
            set -euo pipefail
            mkdir -p "$APP_DIR/releases"

      - name: Subir código a la carpeta de release
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete --exclude=.git --exclude=.github --exclude=backend/tests --exclude=backend/venv --exclude=frontend/node_modules
          path: ./backend/
          remote_path: ${{ env.APP_DIR }}/releases/${{ github.sha }}/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}
